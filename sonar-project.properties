# sonar.organization NAO e definido aqui: o CI passa via -Dsonar.organization,
# a partir da repository variable SONAR_ORGANIZATION do GitHub.

sonar.projectKey=guimullerdev_oficina-execucao-service
sonar.projectName=oficina-execucao-service

sonar.sources=src
sonar.tests=src

sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/generated/**,**/node_modules/**,**/dist/**

# Espelha collectCoverageFrom do jest (package.json). O jest so mede src/
# (rootDir), entao scripts de apoio e configs da raiz ficam fora da cobertura.
sonar.coverage.exclusions=**/*.module.ts,**/main.ts,**/*.dto.ts,**/generated/**,scripts/**,*.config.ts,*.config.mjs

sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
