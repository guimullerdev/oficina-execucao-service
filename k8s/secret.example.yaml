# Placeholder values for local/dev use only. In production the pipeline creates
# this Secret via `kubectl create secret generic` (POD_AWS_* repo secrets are
# mapped to AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, as in billing).
# Never commit real credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-execucao-service-secret
  labels:
    app: oficina-execucao-service
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "dummy_access_key_id"       # from POD_AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: "dummy_secret_access_key" # from POD_AWS_SECRET_ACCESS_KEY
  JWT_SECRET: "change-me"
  SNS_TOPIC_ARN: "arn:aws:sns:us-east-1:000000000000:oficina-execucao-events"
  SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/000000000000/oficina-execucao-queue"
